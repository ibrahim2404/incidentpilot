id: S008
title: Orders upstream timeout set far below inventory's normal latency
difficulty: L2
ground_truth:
  component: orders
  fault: bad_config
  expected_remediation: rollback_config
  summary: >
    orders-config UPSTREAM_TIMEOUT_SECONDS was lowered from 2 to 0.001. Every call from
    orders to inventory times out although inventory answers in a few milliseconds.
    Trap: errors say "timed out" on inventory, which looks like a slow inventory.
  evidence:
    - orders-config UPSTREAM_TIMEOUT_SECONDS = 0.001, changed minutes before the alert
    - orders upstream outcome timeout to inventory
    - inventory p95 latency stays in milliseconds, inventory serves requests without errors
inject:
  - [-n, shop, patch, configmap, orders-config, --type, merge, -p, '{"data":{"UPSTREAM_TIMEOUT_SECONDS":"0.001"}}']
  - [-n, shop, rollout, restart, deployment/orders]
expect_alerts: [HighErrorRate]
timeout_s: 300
revert:
  - [-n, shop, patch, configmap, orders-config, --type, merge, -p, '{"data":{"UPSTREAM_TIMEOUT_SECONDS":"2"}}']
  - [-n, shop, rollout, restart, deployment/orders]
  - [-n, shop, rollout, status, deployment/orders, --timeout=120s]
