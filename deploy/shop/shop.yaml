# Demo app: gateway -> orders -> inventory, plus a load generator.
# Names, labels and config are deliberately neutral: nothing here hints at a fault.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gateway-config, namespace: shop}
data:
  SERVICE_NAME: gateway
  UPSTREAM_URL: http://orders.shop.svc.cluster.local:8080
  UPSTREAM_TIMEOUT_SECONDS: "2"
  REQUEST_VALIDATION_ROUNDS: "1000"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: orders-config, namespace: shop}
data:
  SERVICE_NAME: orders
  UPSTREAM_URL: http://inventory.shop.svc.cluster.local:8080
  UPSTREAM_TIMEOUT_SECONDS: "2"
  RESPONSE_CACHE_ENABLED: "false"
  RESPONSE_CACHE_ENTRY_KB: "256"
  REQUEST_VALIDATION_ROUNDS: "1000"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: inventory-config, namespace: shop}
data:
  SERVICE_NAME: inventory
  REQUEST_VALIDATION_ROUNDS: "1000"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: shop, labels: {app: gateway}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: gateway
          image: incidentpilot/shop:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: gateway-config}}]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: shop, labels: {app: orders}}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata:
      labels: {app: orders}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: orders
          image: incidentpilot/shop:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: orders-config}}]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, namespace: shop, labels: {app: inventory}}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata:
      labels: {app: inventory}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: inventory
          image: incidentpilot/shop:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: inventory-config}}]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: shop}
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: shop}
spec:
  selector: {app: orders}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: inventory, namespace: shop}
spec:
  selector: {app: inventory}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Steady traffic (~4 req/s) so rates and error ratios are meaningful.
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen, namespace: shop, labels: {app: loadgen}}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do wget -q -T 3 -O /dev/null http://gateway.shop.svc.cluster.local:8080/api/checkout; sleep 0.25; done
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 16Mi}
