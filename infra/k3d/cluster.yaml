# Single-node k3s via k3d. Traefik and ServiceLB are disabled to save RAM;
# we use kubectl port-forward instead of an ingress.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: incidentpilot
servers: 1
agents: 0
image: rancher/k3s:v1.30.6-k3s1
options:
  k3d:
    wait: true
    disableLoadbalancer: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
